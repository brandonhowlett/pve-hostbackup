# =============================================================================
# pve-hostbackup.conf — Configuration file
# Install to: /etc/pve-hostbackup/pve-hostbackup.conf
# Permissions: chmod 640, chown root:root  (enforced at startup)
#
# This file is parsed with grep/awk — it is NOT sourced by bash.
# Arrays use the multi-line parenthesis format shown below.
# =============================================================================

# -----------------------------------------------------------------------------
# SCHEDULE
# -----------------------------------------------------------------------------
# Days between automatic backups (systemd timer interval must match).
# 1 = daily, 3 = every 3 days, 7 = weekly
BACKUP_INTERVAL_DAYS=3

# Number of backup archives to retain. Oldest are pruned automatically
# AFTER a new backup is confirmed good.
RETENTION_COUNT=7

# Minimum free space required (MiB) at the destination before writing.
# Backup aborts with a notification if available space is below this.
FREE_SPACE_MIN_MB=512

# -----------------------------------------------------------------------------
# BACKUP DESTINATION — priority order
# The script tries each tier in order and uses the first writable one.
# Set to empty string "" to skip a tier.
# -----------------------------------------------------------------------------

# Tier 1: PVE storage ID (NFS, CIFS, dir-type — any pvesm-managed storage).
# Must match exactly what `pvesm status` shows in the Name column.
# The mountpoint is resolved via pvesm path, not manual parsing.
NFS_STORAGE_ID="nfs-backup"

# Tier 2: ZFS dataset mountpoint (a directory on a ZFS dataset).
# Example: "/mnt/tank/pve-host-backups"
ZFS_BACKUP_PATH=""

# Tier 3: Local directory fallback.
LOCAL_BACKUP_PATH="/var/lib/pve-hostbackup"

# Subdirectory created inside the resolved storage mountpoint.
BACKUP_SUBDIR="pve-host-backups"

# -----------------------------------------------------------------------------
# COMPRESSION
# -----------------------------------------------------------------------------
COMPRESSION="zst"
ZSTD_LEVEL=3

# -----------------------------------------------------------------------------
# ENCRYPTION
# Set ENCRYPT_ARCHIVE=true and point ENCRYPT_PASSPHRASE_FILE to a file
# containing only your passphrase (readable by root only).
#
# Setup:
#   echo 'YourStrongPassphrase' > /etc/pve-hostbackup/.archive-key
#   chmod 400 /etc/pve-hostbackup/.archive-key
#
# Uses `age` if installed (recommended), falls back to openssl AES-256-CBC.
# Install age: apt-get install age
# -----------------------------------------------------------------------------
ENCRYPT_ARCHIVE=false
ENCRYPT_PASSPHRASE_FILE="/etc/pve-hostbackup/.archive-key"

# -----------------------------------------------------------------------------
# NOTIFICATIONS
# -----------------------------------------------------------------------------
EMAIL_ENABLED=true
EMAIL_RECIPIENT="root@localhost"
EMAIL_FROM="pve-hostbackup@HOSTNAME"
EMAIL_SUBJECT_PREFIX="[PVE-HostBackup]"

# PVE built-in notification system (PVE 8.1+).
# Configure a notification target in: Datacenter → Notifications
PVE_NOTIFY_ENABLED=true
PVE_NOTIFY_TARGET="mail-to-root"

# When to notify. Options: "all", "failure", "success"
NOTIFY_ON="all"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
LOG_FILE="/var/log/pve-hostbackup.log"
LOG_MAX_SIZE_MB=20
LOG_ROTATE_COUNT=5

# -----------------------------------------------------------------------------
# ZFS METADATA
# Captures zpool list/status/zfs list as a text file inside the archive.
# This is metadata only — use `zpool import -a` to re-import pools on restore.
# -----------------------------------------------------------------------------
ZFS_CAPTURE_ENABLED=true

# -----------------------------------------------------------------------------
# BACKUP PATHS
# Add or remove paths here. Non-existent paths are silently skipped.
# Do NOT add large data directories — this is for config only.
# /etc/pve is backed up via pmxcfs config.db snapshot (atomic) AND via tar.
# -----------------------------------------------------------------------------
BACKUP_PATHS=(
    # pmxcfs backing database — atomic snapshot (most important)
    "/var/lib/pve-cluster/config.db"

    # Core PVE config (FUSE view — also captured via config.db snapshot)
    "/etc/pve"
    "/etc/pve/priv"

    # VM backup job configuration
    "/etc/vzdump.conf"

    # Network
    "/etc/network/interfaces"
    "/etc/network/interfaces.d"

    # System identity
    "/etc/hostname"
    "/etc/hosts"
    "/etc/resolv.conf"
    "/etc/fstab"

    # SSH
    "/etc/ssh"
    "/root/.ssh"

    # PVE runtime state
    "/var/lib/pve-manager"
    "/var/lib/pvedaemon"
    "/var/lib/pveproxy"
    "/var/lib/pve-firewall"

    # Appliance template index
    "/var/lib/pve-manager/apl-info"

    # Cron
    "/etc/cron.d"
    "/etc/cron.daily"
    "/etc/cron.weekly"
    "/etc/cron.monthly"
    "/var/spool/cron/crontabs"

    # Custom scripts and tools
    "/usr/local/bin"
    "/usr/local/sbin"
    "/usr/local/etc"

    # Systemd custom units
    "/etc/systemd/system"
    "/etc/systemd/network"

    # apt sources
    "/etc/apt/sources.list"
    "/etc/apt/sources.list.d"
    "/etc/apt/preferences.d"

    # Mail (Postfix)
    "/etc/postfix"

    # Security tooling
    "/etc/fail2ban"

    # TLS certificates
    "/etc/ssl/private"
    "/usr/local/share/ca-certificates"

    # Proxmox Backup Server client config
    "/etc/proxmox-backup"

    # Corosync (no-op on single node, harmless)
    "/etc/corosync"
)

# -----------------------------------------------------------------------------
# ADVANCED
# -----------------------------------------------------------------------------
LOCK_FILE="/run/pve-hostbackup.lock"
CHECKSUM_ALGO="sha256"
VERBOSE=false
