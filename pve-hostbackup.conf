# =============================================================================
# pve-hostbackup.conf — Proxmox Host Backup Configuration v3.0.0
#
# SECURITY: This file must be owned by root and not world/group-writable.
#   chown root:root /etc/pve-hostbackup/pve-hostbackup.conf
#   chmod 640 /etc/pve-hostbackup/pve-hostbackup.conf
#
# NOTE: This file is parsed safely (not sourced/eval'd). Only simple
# key="value" pairs and the BACKUP_PATHS=(...) array are supported.
# Do not use subshells, variable expansion, or complex bash syntax.
# =============================================================================

# -----------------------------------------------------------------------------
# SCHEDULE & RETENTION
# -----------------------------------------------------------------------------
# Days between automatic backups. Also update OnUnitActiveSec in the .timer file.
BACKUP_INTERVAL_DAYS="3"

# Number of backup archives to keep. Oldest are pruned after a successful new backup.
RETENTION_COUNT="7"

# Minimum free space (MiB) required on destination before starting. Default: 512 MiB.
MIN_FREE_MB="512"

# -----------------------------------------------------------------------------
# STORAGE DESTINATIONS (priority order: NFS → ZFS → Local)
# -----------------------------------------------------------------------------
# Tier 1 — PVE storage ID as shown in `pvesm status`.
# Must be a storage type with a local filesystem path (dir, nfs, cifs, zfspool).
# Leave empty to skip: NFS_STORAGE_ID=""
NFS_STORAGE_ID="nfs-backup"

# Tier 2 — Explicit ZFS dataset mount path (e.g. a dataset mounted at a directory).
# Leave empty to skip: ZFS_BACKUP_PATH=""
ZFS_BACKUP_PATH=""

# Tier 3 — Local filesystem fallback. Used if tiers 1 and 2 are unavailable.
# WARNING: local-only backups are not protected against host disk failure.
LOCAL_BACKUP_PATH="/var/lib/pve-hostbackup"

# Subdirectory created inside the resolved storage root.
BACKUP_SUBDIR="pve-host-backups"

# -----------------------------------------------------------------------------
# PMXCFS CONSISTENT SNAPSHOT
# /etc/pve is a FUSE filesystem (pmxcfs). Setting this to true stops pve-cluster
# briefly (~5-10 seconds) to obtain an atomic, consistent snapshot of the backing
# SQLite database. STRONGLY RECOMMENDED. Set false only if downtime is unacceptable
# and you accept the risk of dirty reads in the captured /etc/pve tree.
# -----------------------------------------------------------------------------
STOP_PMXCFS_FOR_BACKUP="true"

# -----------------------------------------------------------------------------
# COMPRESSION
# -----------------------------------------------------------------------------
# zst = fast and modern (recommended). gz = wide compat. xz = smallest.
COMPRESSION="zst"

# zstd compression level: 1 (fastest) to 19 (smallest). 3 is a good default.
ZSTD_LEVEL="3"

# -----------------------------------------------------------------------------
# ARCHIVE ENCRYPTION
# Uses `age` (https://age-encryption.org) for symmetric encryption.
# The passphrase file must be stored separately from the backup destination.
# Never store the key on the same disk/share as the archives.
#
# To generate a passphrase file:
#   head -c 48 /dev/urandom | base64 > /etc/pve-hostbackup/backup.key
#   chmod 400 /etc/pve-hostbackup/backup.key
# -----------------------------------------------------------------------------
ENCRYPT_ARCHIVES="false"
ENCRYPT_PASSPHRASE_FILE="/etc/pve-hostbackup/backup.key"

# Checksum algorithm: sha256 or sha512
CHECKSUM_ALGO="sha256"

# -----------------------------------------------------------------------------
# NOTIFICATIONS
# -----------------------------------------------------------------------------
# Email via sendmail/postfix
EMAIL_ENABLED="true"
EMAIL_RECIPIENT="root@localhost"
EMAIL_FROM="pve-hostbackup@localhost"
EMAIL_SUBJECT_PREFIX="[PVE-HostBackup]"

# Proxmox built-in notification system (PVE 8.1+)
# Set PVE_NOTIFY_TARGET to a target name configured under Datacenter → Notifications.
PVE_NOTIFY_ENABLED="true"
PVE_NOTIFY_TARGET="mail-to-root"

# Which events trigger notifications: all | success | failure
NOTIFY_ON="all"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
LOG_FILE="/var/log/pve-hostbackup.log"
LOG_MAX_SIZE_MB="20"
LOG_ROTATE_COUNT="5"

# Set to true to print INFO-level messages to the console (always written to log)
VERBOSE="false"

# Lock file path (prevents concurrent runs)
LOCK_FILE="/run/pve-hostbackup.lock"

# -----------------------------------------------------------------------------
# ZFS METADATA
# Capture `zpool list`, `zpool status`, and `zfs list` output as a metadata
# file inside the archive. Useful for reconstructing pool topology on restore.
# -----------------------------------------------------------------------------
ZFS_CAPTURE_ENABLED="true"

# -----------------------------------------------------------------------------
# BACKUP PATHS
# Paths that exist on this host are included; missing paths are silently skipped.
# /etc/pve is handled separately via pmxcfs snapshot — do not add it here.
# Add custom paths at the end of this list.
# -----------------------------------------------------------------------------
BACKUP_PATHS=(
    # Network configuration
    "/etc/network/interfaces"
    "/etc/network/interfaces.d"

    # System identity
    "/etc/hostname"
    "/etc/hosts"
    "/etc/resolv.conf"

    # Filesystem table and mounts
    "/etc/fstab"

    # SSH host keys and authorized keys
    "/etc/ssh"
    "/root/.ssh"

    # Scheduled jobs
    "/etc/cron.d"
    "/etc/cron.daily"
    "/etc/cron.weekly"
    "/etc/cron.monthly"
    "/var/spool/cron/crontabs"

    # PVE runtime state and databases (excluding /etc/pve — handled by pmxcfs snapshot)
    "/var/lib/pve-manager"
    "/var/lib/pve-cluster"
    "/var/lib/pvedaemon"
    "/var/lib/pveproxy"
    "/var/lib/pvestatd"
    "/var/lib/pve-firewall"

    # PVE appliance template index (CT templates)
    "/var/lib/pve-manager/apl-info"

    # vzdump backup job configuration
    "/etc/vzdump.conf"

    # Proxmox Backup Server client config (if installed)
    "/etc/proxmox-backup"

    # Corosync (single-node: harmless if empty)
    "/etc/corosync"

    # APT repository sources
    "/etc/apt/sources.list"
    "/etc/apt/sources.list.d"
    "/etc/apt/preferences.d"

    # TLS/CA certificates managed outside PVE
    "/etc/ssl/private"
    "/usr/local/share/ca-certificates"

    # Administrator-managed scripts and tools
    "/usr/local/bin"
    "/usr/local/sbin"
    "/usr/local/etc"

    # Mail transport
    "/etc/postfix"

    # Security tooling (if present)
    "/etc/fail2ban"

    # Custom systemd units and drop-ins
    "/etc/systemd/system"
    "/etc/systemd/network"

    # This tool's own config (so it survives a host rebuild)
    "/etc/pve-hostbackup"
)
